name: Build docker image when pushed to main
on:
  push:
    branches: ['main']


env:
  IMAGE_NAME: econgood/balance-sheet-api

jobs:
#  checks:
#    uses: ./.github/workflows/check-workflow.yml
#    with:
#      node-version: 18.7.0
#    secrets: inherit

  build:
    runs-on: ubuntu-latest
#    needs:
#      - checks
    steps:
      - uses: actions/checkout@v5
      - name: Build and tag image
        run: |
          docker build -t ${{env.IMAGE_NAME}}:${{ github.sha }} -t ${{env.IMAGE_NAME}}:latest .

      - name: Login to econgood repo
        run: |
          docker login -u econgood -p ${{ secrets.ECONGOOD_CONTAINER_REGISTRY }}

      - name: Push the image
        run: |
          docker push ${{env.IMAGE_NAME}} --all-tags


